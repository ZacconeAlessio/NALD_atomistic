name: NALD viscosity tests

on:
  pull_request:
    paths:
      - "viscosity/**"
      - ".github/workflows/viscosity-tests.yml"
  push:
    branches:
      - "feature/shear-bulk-viscosity"
    paths:
      - "viscosity/**"
      - ".github/workflows/viscosity-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip numpy
      - run: python -m py_compile viscosity/*.py
      - run: python viscosity/test_viscosity_nald.py -v

      - run: python viscosity/validate_kobayashi_reference.py
